name: integrations

# The optional-dependency surfaces, exercised against the real frameworks.
#
# These live in their own workflow rather than in tests.yml because they are the
# only jobs here that install anything, and a framework releasing a breaking
# change should show up as a red integrations run without making the core suite
# look broken. The core suite stays stdlib-only and must never depend on this.
#
# This exists because the Inspect surface shipped declared-but-unexercised: the
# entry point was registered, the docs gave an invocation that did not resolve,
# and nothing in CI would have caught it. A declared integration that nobody
# runs is a claim, not a feature.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. These break from upstream releases, not from our commits, so a
    # push-only trigger would find out whenever someone happened to push next.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[inspect,pytest]"
      - run: python -m pytest tests/test_inspect_integration.py -q
      # The documented command, run exactly as a reader would type it. The
      # end-to-end test covers the API path; this covers the CLI path, which is
      # where the invocation was wrong.
      - run: inspect eval verdict_injection --model mockllm/model --limit 2 --log-dir "$RUNNER_TEMP/logs"

  deepeval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[deepeval,pytest]"
      - run: python -m pytest tests/test_deepeval_adapter.py -q

  core-stays-dependency-free:
    # The whole pitch is "offline, stdlib-only, zero model spend". If an
    # integration ever leaks a hard dependency into the package, this fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[pytest]"
      - name: assert no third-party runtime dependencies were installed
        run: |
          python - <<'EOF'
          from importlib.metadata import requires
          reqs = [r for r in (requires("etb-scan") or []) if "extra ==" not in r]
          assert not reqs, f"etb-scan grew runtime dependencies: {reqs}"
          print("ok: no runtime dependencies")
          EOF
      - run: python -m pytest tests/ -q
      - run: etbscan
