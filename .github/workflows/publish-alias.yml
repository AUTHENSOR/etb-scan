name: publish-alias

# Publishes the defensive `etbscan` alias from alias-etbscan/.
#
# Separate from publish.yml because PyPI Trusted Publishing binds a publisher to
# a (project name, owner, repo, workflow, environment) tuple, and `etbscan` is a
# different project from `etb-scan`. It therefore needs its own pending
# publisher and its own workflow file.
#
# Manual only. The alias changes roughly never; it exists to hold the name.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi-alias
      url: https://pypi.org/p/etbscan
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 -m pip install --upgrade build twine
      - run: python3 -m build
        working-directory: alias-etbscan
      - run: python3 -m twine check --strict dist/*
        working-directory: alias-etbscan
      # The alias must never ship a module. etb-scan already owns the `etbscan`
      # import package and a second one would collide on install.
      - name: assert the alias ships no importable code
        working-directory: alias-etbscan
        run: |
          if unzip -l dist/*.whl | grep -qE '\.py$'; then
            echo "alias wheel contains Python modules; it must be metadata only"
            unzip -l dist/*.whl
            exit 1
          fi
          echo "ok: no modules in the alias wheel"
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: alias-etbscan/dist
