[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Defensive alias for the PyPI name `etbscan`.
#
# PEP 503 normalization collapses runs of -_. but does not remove them, so
# `etb-scan` and `etbscan` are two different projects on PyPI. Our import name
# and our console script are both `etbscan`, which is what people type, so the
# unhyphenated name is the likelier typo target and the likelier squat.
#
# This distribution ships NO modules. It is metadata and a dependency, nothing
# else. That is deliberate: etb-scan already provides the `etbscan` import
# package, and shipping a second one under this name would collide on install.
[project]
name = "etbscan"
version = "0.1.0"
description = "Alias for etb-scan. Installs the real package; provides no code of its own."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Authensor, Inc.", email = "john@authensor.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["etb-scan>=0.1.0"]

[project.urls]
Homepage = "https://www.authensor.com/etb"
Source = "https://github.com/AUTHENSOR/etb-scan"

# No [tool.setuptools.packages]; there is nothing to package.
[tool.setuptools]
packages = []
