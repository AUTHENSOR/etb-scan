# Consumers add this repo to .pre-commit-config.yaml:
#
#   - repo: https://github.com/AUTHENSOR/etb-scan
#     rev: v1
#     hooks:
#       - id: etb-scan
#         # Point it at your judge; without args it validates the built-in
#         # reference judges (a tool health check, not a scan of yours).
#         args: ["--judge", "mypkg.judges:my_judge", "--max-asr", "0.0", "--trials", "5"]
#
- id: etb-scan
  name: etb-scan (evaluator trust boundary)
  description: >-
    Fails the commit if your LLM judge can be made to pass a failing answer
    by text the evaluated model wrote (ETB-01 verdict injection).
  entry: etbscan
  language: python
  pass_filenames: false
  always_run: true
